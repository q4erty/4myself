<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid #ddd;
        }
        .email-header {
            background: #4caf50;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            font-size: 24px;
        }
        .email-body {
            padding: 20px;
            color: #333333;
            line-height: 1.6;
        }
        .email-body h2 {
            color: #4caf50;
            margin-bottom: 10px;
        }
        .email-footer {
            text-align: center;
            background: #f4f4f4;
            padding: 10px;
            font-size: 14px;
            color: #555555;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background: #4caf50;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
        }
        .btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="email-header">
        Welcome to Our Service!
    </div>
    <div class="email-body">
        <h2 th:text="${subject}">Subject Placeholder</h2>
        <p th:text="${username}">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin non mi nec metus volutpat malesuada.
        </p>
        <p th:text="${message}">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Proin non mi nec metus volutpat malesuada.
        </p>
    </div>
    <div class="email-footer">
        &copy; 2025 Your Company. All rights reserved.
    </div>
</div>
</body>
</html>
